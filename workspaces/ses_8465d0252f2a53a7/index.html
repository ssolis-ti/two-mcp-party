<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Todo App</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #1a1a1a; color: #fff; }
        .todo-box { max-width: 400px; margin: 0 auto; background: #2a2a2a; padding: 1rem; border-radius: 8px; }
        input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; box-sizing: border-box; }
        ul { list-style: none; padding: 0; }
        li { padding: 0.5rem; background: #333; margin-bottom: 0.5rem; display: flex; justify-content: space-between; }
        button { background: #e74c3c; color: white; border: none; padding: 0.2rem 0.5rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="todo-box">
        <h2>Shared Tasks</h2>
        <input type="text" id="taskInput" placeholder="New task... (Press Enter)">
        <ul id="taskList"></ul>
    </div>
    <script src="ui.js"></script>
</body>
</html>
